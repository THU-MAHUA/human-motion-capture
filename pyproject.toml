[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realsense-human-motion-capture"
version = "0.2.0"
description = "Intel RealSense D435 human motion capture with MMPose and optional HMR2 mesh output"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.23.5,<2",
  "opencv-python==4.10.0.84",
]

[project.optional-dependencies]
pose = [
  "numpy==1.26.4",
  "torch==2.1.0",
  "torchvision==0.16.0",
  "mmcv==2.1.0",
  "mmengine==0.10.7",
  "mmdet==3.2.0",
  "mmpose==1.3.2",
  "xtcocotools==1.14.3",
  "pyrealsense2==2.57.7.10387",
]
mesh = [
  "numpy==1.23.5",
  "torch==2.1.0",
  "torchvision==0.16.0",
  "pytorch-lightning==2.1.3",
  "smplx==0.1.28",
  "pyrender==0.1.45",
  "yacs==0.1.8",
  "scikit-image==0.21.0",
  "einops==0.7.0",
  "timm==0.9.12",
  "dill==0.3.8",
  "pandas==2.0.3",
  "gdown==5.2.0",
  "webdataset==0.2.86",
  "hmr2 @ git+https://github.com/shubham-goel/4D-Humans.git@efe18deff163b29dff87ddbd575fa29b716a356c",
  "detectron2 @ git+https://github.com/facebookresearch/detectron2.git@a2f4a8771ab77e8411c26b27f24f9489a28a2453",
]
test = [
  "pytest==8.3.5",
]

[project.scripts]
motion-capture = "realsense_motion_capture.live_capture:main"
motion-capture-replay = "realsense_motion_capture.replay:main"
motion-capture-download-models = "realsense_motion_capture.prefetch_models:main"
motion-capture-hmr2-worker = "realsense_motion_capture.hmr2_worker:main"

[project.urls]
Repository = "https://github.com/THU-MAHUA/human-motion-capture"
MMPose = "https://github.com/open-mmlab/mmpose"
4D-Humans = "https://github.com/shubham-goel/4D-Humans"

[tool.setuptools]
package-dir = {"" = "pose-capture"}

[tool.setuptools.packages.find]
where = ["pose-capture"]
