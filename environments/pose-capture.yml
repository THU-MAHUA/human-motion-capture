name: pose-capture
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.3
  - setuptools<81
  - wheel
  - numpy=1.26.4
  - cython<3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - --find-links https://download.openmmlab.com/mmcv/dist/cu121/torch2.1/index.html
      - torch==2.1.0+cu121
      - torchvision==0.16.0+cu121
      - mmcv==2.1.0
      - mmengine==0.10.7
      - mmdet==3.2.0
      - xtcocotools==1.14.3
      - opencv-python==4.10.0.84
      - pyrealsense2==2.57.7.10387
      - pytest==8.3.5
      - typeguard==4.4.4
      - xdoctest==1.2.0
      - mmpose==1.3.2
