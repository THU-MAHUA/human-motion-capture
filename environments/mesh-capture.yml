name: mesh-capture
channels:
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.3
  - setuptools<81
  - wheel
  - numpy=1.23.5
  - cuda-nvcc=11.8
  - cuda-cudart-dev=11.8
  - ninja
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.1.0+cu118
      - torchvision==0.16.0+cu118
      - pytorch-lightning==2.1.3
      - smplx==0.1.28
      - pyrender==0.1.45
      - opencv-python==4.10.0.84
      - yacs==0.1.8
      - scikit-image==0.21.0
      - einops==0.7.0
      - timm==0.9.12
      - dill==0.3.8
      - pandas==2.0.3
      - gdown==5.2.0
      - webdataset==0.2.86
      - chumpy==0.70
      # CUDA 11 runtime/development libraries used by the Detectron2 extension.
      - nvidia-cuda-runtime-cu11==11.7.99
      - nvidia-cublas-cu11==11.10.3.66
      - nvidia-cusparse-cu11==11.7.4.91
      - nvidia-cusolver-cu11==11.4.0.1
      - git+https://github.com/shubham-goel/4D-Humans.git
      - detectron2 @ https://codeload.github.com/facebookresearch/detectron2/tar.gz/refs/heads/main
